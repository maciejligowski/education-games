<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Słownictwo japońskie - Quiz</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      padding: 20px;
    }

    .app-container {
      max-width: 1000px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: 1fr;
      gap: 20px;
    }

    /* Header Section */
    .header {
      background: white;
      border-radius: 16px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.1);
      padding: 24px;
      text-align: center;
    }

    .header h1 {
      color: #333;
      font-size: 2rem;
      margin-bottom: 8px;
      font-weight: 700;
    }

    .header p {
      color: #666;
      font-size: 1rem;
    }

    /* Controls Panel */
    .controls-panel {
      background: white;
      border-radius: 16px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.1);
      padding: 24px;
    }

    .controls-title {
      font-size: 1.2rem;
      font-weight: 600;
      color: #333;
      margin-bottom: 20px;
      text-align: center;
      border-bottom: 2px solid #f0f0f0;
      padding-bottom: 12px;
    }

    .controls-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 20px;
    }

    .control-group {
      display: flex;
      flex-direction: column;
    }

    .control-group label {
      font-weight: 600;
      color: #333;
      margin-bottom: 8px;
      font-size: 0.95rem;
    }

    .control-group select {
      padding: 12px 16px;
      border: 2px solid #e9ecef;
      border-radius: 8px;
      font-size: 1rem;
      transition: all 0.3s ease;
      background: white;
    }

    .control-group select:focus {
      outline: none;
      border-color: #007bff;
      box-shadow: 0 0 0 3px rgba(0,123,255,0.1);
    }

    .checkbox-group {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 16px;
      background: #f8f9fa;
      border-radius: 8px;
      border: 2px solid #e9ecef;
      transition: all 0.3s ease;
    }

    .checkbox-group:hover {
      background: #e9ecef;
    }

    .checkbox-group input[type="checkbox"] {
      width: 20px;
      height: 20px;
      accent-color: #007bff;
    }

    .checkbox-group label {
      margin: 0 !important;
      cursor: pointer;
      user-select: none;
    }

    /* Main Learning Card */
    .main-card {
      background: white;
      border-radius: 16px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.1);
      padding: 32px;
      text-align: center;
      min-height: 350px;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .question-label {
      font-size: 1.1rem;
      color: #666;
      margin-bottom: 16px;
      font-weight: 500;
    }

    .question-text {
      font-size: 3.5rem;
      font-weight: bold;
      color: #333;
      margin-bottom: 20px;
      min-height: 100px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'MS Gothic', 'Yu Gothic', monospace;
    }

    .pronunciation {
      font-size: 1.2rem;
      color: #666;
      font-style: italic;
      margin-bottom: 24px;
    }

    .answer-box {
      background: linear-gradient(135deg, #e8f5e8 0%, #f0f8f0 100%);
      border: 2px solid #4caf50;
      border-radius: 12px;
      padding: 24px;
      margin: 24px 0;
      text-align: left;
    }

    .answer-box span {
      display: block;
      margin-bottom: 8px;
      font-size: 1.05rem;
    }

    .answer-box span strong {
      color: #333;
      min-width: 100px;
      display: inline-block;
    }

    .answer-box span:last-child {
      margin-bottom: 0;
    }

    #categoryRow {
      font-style: italic;
      color: #666;
      font-size: 0.95rem;
      border-top: 1px solid #ddd;
      padding-top: 12px;
      margin-top: 12px;
    }

    /* Actions Panel */
    .actions-panel {
      background: white;
      border-radius: 16px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.1);
      padding: 24px;
    }

    .primary-actions {
      display: flex;
      gap: 16px;
      justify-content: center;
      margin-bottom: 20px;
    }

    .secondary-actions {
      display: flex;
      gap: 12px;
      justify-content: center;
      margin-bottom: 20px;
    }

    .btn {
      padding: 14px 28px;
      border: none;
      border-radius: 10px;
      font-size: 1.05rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
      min-width: 140px;
      position: relative;
      overflow: hidden;
    }

    .btn::before {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
      transition: left 0.5s;
    }

    .btn:hover::before {
      left: 100%;
    }

    .btn-primary {
      background: linear-gradient(135deg, #007bff, #0056b3);
      color: white;
    }

    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 25px rgba(0,123,255,0.4);
    }

    .btn-success {
      background: linear-gradient(135deg, #28a745, #1e7e34);
      color: white;
    }

    .btn-success:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 25px rgba(40,167,69,0.4);
    }

    .btn-danger {
      background: linear-gradient(135deg, #dc3545, #bd2130);
      color: white;
    }

    .btn-danger:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 25px rgba(220,53,69,0.4);
    }

    .btn-secondary {
      background: linear-gradient(135deg, #6c757d, #545b62);
      color: white;
      font-size: 0.95rem;
      padding: 10px 20px;
      min-width: 120px;
    }

    .btn-secondary:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(108,117,125,0.4);
    }

    /* Stats Panel */
    .stats-panel {
      background: white;
      border-radius: 16px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.1);
      padding: 20px;
      text-align: center;
    }

    .stats-content {
      font-size: 1.05rem;
      color: #666;
      font-weight: 500;
    }

    .reset-section {
      border-top: 1px solid #e9ecef;
      margin-top: 20px;
      padding-top: 20px;
      text-align: center;
    }

    .btn-reset {
      background: linear-gradient(135deg, #6c757d, #545b62);
      color: white;
      font-size: 0.9rem;
      padding: 8px 20px;
      min-width: auto;
    }

    /* Responsive Design */
    @media (max-width: 768px) {
      .app-container {
        padding: 10px;
        gap: 16px;
      }

      .controls-grid {
        grid-template-columns: 1fr;
        gap: 16px;
      }

      .question-text {
        font-size: 2.5rem;
        min-height: 80px;
      }

      .primary-actions {
        flex-direction: column;
      }

      .secondary-actions {
        flex-wrap: wrap;
        gap: 8px;
      }

      .btn {
        min-width: 100px;
        padding: 12px 20px;
      }
    }
  </style>
</head>
<body>
  <div class="app-container">
    <!-- Header Section -->
    <div class="header">
      <h1>Słownictwo japońskie</h1>
      <p>Quiz z dźwiękiem i opcjonalnym tłumaczeniem</p>
    </div>

    <!-- Controls Panel -->
    <div class="controls-panel">
      <div class="controls-title">⚙️ Ustawienia nauki</div>
      <div class="controls-grid">
        <div class="control-group">
          <label>Tryb pytania:</label>
          <select id="questionMode">
            <option value="polish">Pytanie po polsku → Odpowiedź po japońsku</option>
            <option value="hiragana">Pytanie hiragana → Odpowiedź po polsku</option>
            <option value="kanji">Pytanie kanji → Odpowiedź po polsku</option>
          </select>
        </div>
        
        <div class="control-group">
          <label>Kategoria słów:</label>
          <select id="categoryFilter">
            <option value="all">Wszystkie kategorie</option>
            <option value="people">Ludzie</option>
            <option value="occupations">Zawody</option>
            <option value="body">Ciało</option>
            <option value="family">Rodzina</option>
            <option value="animals">Zwierzęta</option>
            <option value="plants">Rośliny</option>
            <option value="food">Jedzenie</option>
            <option value="drink">Napoje</option>
            <option value="time">Czas</option>
            <option value="weather">Pogoda</option>
            <option value="colors">Kolory</option>
            <option value="numbers">Liczby</option>
            <option value="directions">Kierunki</option>
            <option value="home">Dom</option>
            <option value="clothes">Ubrania</option>
            <option value="transport">Transport</option>
            <option value="language">Język</option>
            <option value="adjectives">Przymiotniki</option>
            <option value="verbs">Czasowniki</option>
          </select>
        </div>

        <div class="control-group">
          <div class="checkbox-group">
            <input type="checkbox" id="enableVoice" checked>
            <label for="enableVoice">🔊 Włącz dźwięk</label>
          </div>
        </div>
      </div>
    </div>

    <!-- Main Learning Card -->
    <div class="main-card">
      <div class="question-label" id="questionLabel">Znaczenie po polsku:</div>
      <div id="questionText" class="question-text">–</div>
      <div id="pronunciation" class="pronunciation" style="display:none;"></div>
      
      <div id="answerBox" class="answer-box" style="display:none;">
        <span id="kanjiRow"><strong>Kanji:</strong> <span id="kanji"></span></span>
        <span id="hiraganaRow"><strong>Hiragana:</strong> <span id="hiragana"></span></span>
        <span id="romajiRow"><strong>Romaji:</strong> <span id="romaji"></span></span>
        <span id="polishRow"><strong>Znaczenie po polsku:</strong> <span id="polish"></span></span>
        <span id="categoryRow"><strong>Kategoria:</strong> <span id="category"></span></span>
      </div>
    </div>

    <!-- Actions Panel -->
    <div class="actions-panel">
      <div class="primary-actions">
        <button id="showAnswerBtn" class="btn btn-primary">📖 Pokaż odpowiedź</button>
      </div>

      <div class="secondary-actions">
        <button id="repeatQuestionBtn" class="btn btn-secondary">🔄 Powtórz pytanie</button>
        <button id="repeatAnswerBtn" class="btn btn-secondary">🔊 Powtórz odpowiedź</button>
      </div>

      <div class="primary-actions">
        <button id="knowBtn" class="btn btn-success">✅ Umiem</button>
        <button id="dontKnowBtn" class="btn btn-danger">❌ Nie umiem</button>
      </div>

      <div class="reset-section">
        <button id="resetBtn" class="btn btn-reset">🔄 Rozpocznij od nowa</button>
      </div>
    </div>

    <!-- Stats Panel -->
    <div class="stats-panel">
      <div class="stats-content" id="statsInfo">Ładowanie...</div>
    </div>
  </div>

  <script src="vocabulary-jp-basic.js"></script>
  <script src="app-enhanced.js"></script>
</body>
</html>
